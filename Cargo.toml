[package]
name = "neo4j-migrator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.139"
polars = "0.46.0"
sqlparser = "0.55.0"
mylog = "0.1.5"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3.32"

[profile.dev]
incremental = true
